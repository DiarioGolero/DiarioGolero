<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Redacción · Diario Golero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head><body>
<header class="top"><div class="wrap">
  <div><h1 class="brand">Diario<span>Golero</span></h1><p class="tag">Sala de redacción</p></div>
  <div><a class="hlink" href="/">Ver portada</a><button class="btn mark sm" id="logout" type="button" hidden>Salir</button></div>
</div></header>
<main class="wrap">
  <section id="login" class="login">
    <h2>Entrar a la redacción</h2>
    <label for="pw">Clave de redacción</label>
    <input type="password" id="pw" autocomplete="current-password">
    <p id="loginErr" role="alert" style="color:var(--danger);font:600 14px var(--ui);min-height:1.4em;margin:0 0 8px"></p>
    <button class="btn" id="enter" type="button">Entrar</button>
  </section>
  <section id="desk" hidden>
    <div class="deskhead"><h2>Sala de redacción</h2><button class="btn mark" id="new" type="button">Escribir artículo</button></div>
    <p class="hint">Lo que publiques aparece en la portada pública. Los borradores se guardan solo en este navegador y el público no los ve.</p>
    <div class="seg" id="tabs" role="group" aria-label="Sección de la redacción">
      <button type="button" data-k="pub" aria-pressed="true">Publicados</button>
      <button type="button" data-k="dr" aria-pressed="false">Borradores</button>
      <button type="button" data-k="rs" aria-pressed="false">Resultados</button>
      <button type="button" data-k="cm" aria-pressed="false">Comentarios</button>
    </div>
    <p id="status" role="status"></p>
    <div id="deskList"></div>
    <div id="results" hidden></div>
    <div id="cmList" hidden></div>
  </section>
</main>
<dialog id="reader"><div class="dlg" id="readerBody"></div></dialog>
<dialog id="editor"><div class="dlg">
  <h2 id="edTitle">Nuevo artículo</h2>
  <div class="seg" role="group" aria-label="Tipo de artículo" id="typeSeg">
    <button type="button" data-t="news" aria-pressed="true">Noticia</button>
    <button type="button" data-t="ed" aria-pressed="false">Editorial</button>
  </div>
  <label for="fTitle">Título</label><input type="text" id="fTitle" maxlength="140">
  <div class="frow">
    <div><label for="fSec">Sección</label><select id="fSec"></select></div>
    <div><label for="fAuthor">Autor</label><input type="text" id="fAuthor" maxlength="60"></div>
  </div>
  <label for="fAImg">Foto del autor (opcional)</label>
  <input type="file" id="fAImg" accept="image/*">
  <div id="aBox" hidden><img id="aPrev" class="aprev" alt="Foto del autor"><button class="btn sm ghost" id="aDel" type="button">Quitar foto</button></div>
  <p id="aMsg" role="status" style="font:600 14px var(--ui);color:var(--muted);margin:6px 0 0"></p>
  <label for="fLead">Bajada (resumen corto)</label><input type="text" id="fLead" maxlength="220">
  <label for="fImg">Imagen (opcional)</label>
  <input type="file" id="fImg" accept="image/*">
  <div id="imgBox" hidden><img id="imgPrev" class="imgprev" alt="Vista previa de la imagen"><button class="btn sm ghost" id="imgDel" type="button">Quitar imagen</button></div>
  <p id="imgMsg" role="status" style="font:600 14px var(--ui);color:var(--muted);margin:6px 0 0"></p>
  <label for="fBody">Texto (separa los párrafos con una línea en blanco)</label><textarea id="fBody"></textarea>
  <label class="chk" id="liveRow"><input type="checkbox" id="fLive"> Marcar como último minuto</label>
  <label class="chk"><input type="checkbox" id="fFeat"> Poner en portada (será la nota principal del mosaico)</label>
  <p id="err" role="alert" style="color:var(--danger);font:600 14px var(--ui);margin:10px 0 0"></p>
  <div class="actions">
    <button class="btn ghost" id="cancel" type="button">Cancelar</button>
    <button class="btn ghost" id="preview" type="button">Vista previa</button>
    <button class="btn ghost" id="saveDraft" type="button">Guardar borrador</button>
    <button class="btn" id="savePub" type="button">Publicar</button>
  </div>
</div></dialog>
<script src="/common.js"></script>
<script src="/admin.js"></script>
</body></html>
