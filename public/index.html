<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">

<header class="top"><div class="wrap wide">

<main class="wrap wide">

    <nav class="bubbles" id="bubbles" aria-label="Tipo de contenido"></nav>

      <div class="filters"><div class="sbox">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <input id="q" type="search" placeholder="Buscar" aria-label="Buscar">
      </div></div>
      <div class="chips" id="secs" role="group" aria-label="Sección"></div>
      <section class="mosaic" id="mosaic" aria-label="Noticias"><div class="empty">Cargando…</div></section>
      <div class="morewrap"><button class="btn ghost" id="more" type="button" hidden>Ver más notas</button></div>
    </div>
    <aside class="b-rail" id="rail" aria-label="Lo más leído"><h2>Lo más leído</h2><ol class="rd" id="top"></ol></aside>
  </div>

<footer>Diario Golero</footer>
<script src="/common.js"></script>
